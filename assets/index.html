<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RightTr Card</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --panel: #0b0d12;
      --panel-2: #10151c;
      --ink: #f4b35f;
      --ink-soft: #ffd27e;
      --line: rgba(255, 213, 138, 0.18);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(244, 179, 95, 0.12), transparent 36%),
        radial-gradient(circle at 50% 60%, rgba(255, 210, 126, 0.06), transparent 42%),
        var(--bg);
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .frame {
      position: relative;
      width: min(1200px, calc(100vw - 32px));
      height: min(760px, calc(100vh - 32px));
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
        linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(255, 223, 160, 0.10);
      box-shadow:
        0 26px 70px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      mix-blend-mode: screen;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 58%, transparent 100%);
    }

    body.export-mode {
      background: transparent;
    }

    body.export-mode .frame {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

    body.export-mode .grain {
      display: none;
    }

    body.export-mode canvas {
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="c"></canvas>
    <div class="grain"></div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const params = new URLSearchParams(location.search);
    const phaseOffset = Number(params.get('phase') || 0);
    const exportMode = params.get('export') === '1';
    if (exportMode) document.body.classList.add('export-mode');

    const features = [
      { t: 0.05, d: 74, s: 5.4 },
      { t: 0.12, d: 58, s: 3.6 },
      { t: 0.20, d: 66, s: 4.9 },
      { t: 0.31, d: 60, s: 3.1 },
      { t: 0.41, d: 72, s: 5.6 },
      { t: 0.53, d: 64, s: 3.8 },
      { t: 0.63, d: 78, s: 5.8 },
      { t: 0.74, d: 56, s: 3.2 },
      { t: 0.82, d: 69, s: 4.7 },
      { t: 0.90, d: 61, s: 3.5 },
      { t: 0.97, d: 76, s: 5.2 },
      { t: 0.16, d: -30, s: 2.8 },
      { t: 0.34, d: -38, s: 3.5 },
      { t: 0.49, d: -26, s: 2.6 },
      { t: 0.67, d: -41, s: 3.8 },
      { t: 0.86, d: -33, s: 3.1 },
    ];

    let W = 0, H = 0, DPR = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      W = rect.width;
      H = rect.height;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function routePoint(t) {
      const cx = W * 0.505;
      const cy = H * 0.53;
      const a = W * 0.225;
      const b = H * 0.235;
      const th = t * Math.PI * 2;
      const x = cx + a * (
        0.98 * Math.cos(th) +
        0.06 * Math.cos(2 * th + 0.7) +
        0.03 * Math.cos(3 * th - 1.4)
      );
      const y = cy + b * (
        0.94 * Math.sin(th) -
        0.05 * Math.sin(2 * th - 0.5) +
        0.03 * Math.sin(3 * th + 1.0)
      );
      return { x, y };
    }

    function routeTangent(t) {
      const p1 = routePoint((t + 0.002) % 1);
      const p0 = routePoint((t - 0.002 + 1) % 1);
      return { x: p1.x - p0.x, y: p1.y - p0.y };
    }

    function jitter(seed, amount) {
      return (Math.sin(seed * 127.1) * 43758.5453 % 1 - 0.5) * 2 * amount;
    }

    function sketchLine(ax, ay, bx, by, seed, color, width, alpha = 1) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;

      for (let pass = 0; pass < 2; pass++) {
        const j = pass === 0 ? 1 : 0.6;
        ctx.beginPath();
        ctx.moveTo(ax + jitter(seed + 1, 1.6 * j), ay + jitter(seed + 2, 1.6 * j));
        const mx = (ax + bx) * 0.5 + jitter(seed + 3, 10 * j);
        const my = (ay + by) * 0.5 + jitter(seed + 4, 10 * j);
        ctx.quadraticCurveTo(mx, my, bx + jitter(seed + 5, 1.6 * j), by + jitter(seed + 6, 1.6 * j));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawLandmark(f, t, i) {
      const cx = W * 0.51;
      const cy = H * 0.56;
      const p = routePoint(f.t);
      const dx = p.x - cx;
      const dy = p.y - cy;
      const len = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / len;
      const uy = dy / len;
      const px = p.x + ux * f.d + Math.sin(t * 2.1 + i) * 2.4;
      const py = p.y + uy * f.d + Math.cos(t * 1.7 + i * 0.8) * 2.0;
      const pulse = 0.45 + 0.55 * Math.max(0, Math.sin(t * 3 + i * 0.7));
      const size = f.s;
      ctx.save();
      ctx.globalAlpha = 0.4 + pulse * 0.55;
      ctx.strokeStyle = '#ffd27e';
      ctx.fillStyle = '#f4b35f';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(px, py, size + 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return { x: px, y: py };
    }

    function drawRoute(progress) {
      const steps = 220;
      ctx.save();
      ctx.strokeStyle = '#2a2f37';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = routePoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = '#f4b35f';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = routePoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = '#fff0cc';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([10, 14]);
      ctx.lineDashOffset = -progress * 220;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = routePoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    function frame(now) {
      const base = exportMode ? phaseOffset : (now + phaseOffset);
      const t = (base * 0.00008) % 1;
      const progress = t;
      const cam = routePoint(t);
      const tan = routeTangent(t);
      const ang = Math.atan2(tan.y, tan.x);

      ctx.clearRect(0, 0, W, H);

      if (!exportMode) {
        const g = ctx.createRadialGradient(W * 0.5, H * 0.48, 30, W * 0.5, H * 0.48, Math.max(W, H) * 0.75);
        g.addColorStop(0, 'rgba(244,179,95,0.15)');
        g.addColorStop(0.35, 'rgba(244,179,95,0.05)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      if (!exportMode) {
        ctx.strokeStyle = 'rgba(255, 213, 138, 0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 18; i++) {
          const y = (H / 18) * i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y + Math.sin(t * 5 + i) * 0.7);
          ctx.stroke();
        }
      }

      drawRoute(progress);

      const visible = [];
      for (let i = 0; i < features.length; i++) {
        const pos = drawLandmark(features[i], t, i);
        const dx = pos.x - cam.x;
        const dy = pos.y - cam.y;
        const dist = Math.hypot(dx, dy);
        const alpha = smoothstep(340, 90, dist) * 0.82;
        if (alpha > 0.08) visible.push({ pos, alpha, dist, i });
      }

      visible.sort((a, b) => a.dist - b.dist);
      for (const item of visible) {
        const { x, y } = item.pos;
        const a = item.alpha;
        sketchLine(cam.x, cam.y, x, y, item.i * 19.2 + now * 0.001, '#ffcf7a', 1.6, a * 0.8);
      }

      const halo = ctx.createRadialGradient(cam.x, cam.y, 0, cam.x, cam.y, 34);
      halo.addColorStop(0, 'rgba(255, 210, 126, 0.38)');
      halo.addColorStop(0.45, 'rgba(255, 210, 126, 0.14)');
      halo.addColorStop(1, 'rgba(255, 210, 126, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cam.x, cam.y, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(cam.x, cam.y);
      ctx.rotate(ang);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#ffd27e';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 10.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#fff0cc';
      ctx.beginPath();
      ctx.arc(0, 0, 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize, { passive: true });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
